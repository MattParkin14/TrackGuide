<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackGuide — iRacing Track Recommender</title>
    <meta name="description" content="Pick the iRacing cars you race. We rank tracks by bang-for-buck so you know what to buy next." />
    <script>
      // Set theme before first paint to avoid flash of wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : systemPrefersDark
          if (dark) document.documentElement.classList.add('dark')
        } catch (_) {}
      })()
    </script>
    <!-- Cloudflare Web Analytics: provides page-view counts, geographic breakdown,
         core web vitals, and referrer data. Set VITE_CF_ANALYTICS_TOKEN in
         .env.local (or your deployment environment) to activate. Get your token
         from the Cloudflare dashboard → Web Analytics → Add a site. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "%VITE_CF_ANALYTICS_TOKEN%"}'
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
